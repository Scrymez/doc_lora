name: Deploy to Beget (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      # Собираем то, что должно лежать в public_html:
      #  - весь собранный сайт (dist)
      #  - PHP-вебхук в папке pay/
      - name: Assemble deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy/pay
          cp -r dist/. deploy/
          cp server/pay-callback.php deploy/pay/pay-callback.php

      - name: Upload to Beget via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Путь к корню сайта на Beget. При необходимости поправьте.
          server-dir: /loromarova.ru/public_html/
          local-dir: ./deploy/
          # НЕ трогаем секретный конфиг и служебный файл состояния на сервере
          exclude: |
            **/config.php
            **/.ftp-deploy-sync-state.json
            **/.git*
