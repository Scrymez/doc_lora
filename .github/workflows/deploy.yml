name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      # Собираем содержимое public_html: сайт (dist) + PHP-вебхук в pay/
      - name: Assemble deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy/pay
          cp -r dist/. deploy/
          cp server/pay-callback.php deploy/pay/pay-callback.php
          # чтобы git pull на хостинге не удалял конфиг с ключами
          touch deploy/.nojekyll

      # Публикуем в ветку deploy (готовые файлы для Beget)
      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: deploy
          force_orphan: true
          exclude_assets: ''
